<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script><title>Link Expand</title></head><body>
<h1>Link Expand · 浏览器捕获</h1><p>只捕获你手动启用的当前标签页，十分钟后自动停止。播放视频后刷新列表。</p>
<label>本地软件地址<input id="base" value="http://127.0.0.1:8765"></label>
<label>配对码<input id="token" type="password" placeholder="在 Link Expand 点击“复制扩展配对码”"></label>
<div class="buttons"><button id="start">捕获当前标签页</button><button id="stop">停止</button><button id="refresh">刷新列表</button></div>
<select id="resources" multiple size="6"></select><button id="import">导入选中资源</button>
<p id="status" role="status"></p><small>请求中的 Cookie / Authorization 仅用于你主动导入的资源；只发送到本机，不上传云端。关闭捕获可清空列表。</small>
</body></html>
